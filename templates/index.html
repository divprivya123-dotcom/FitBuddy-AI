<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitBuddy | Personal fitness planning</title>
    <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
</head>

<body>

<main class="shell">
    <nav class="nav"><a class="brand" href="/">Fit<span>Buddy</span></a><a href="/view-all-users">View all users</a></nav>
    <section class="hero">
        <div><div class="eyebrow">AI guided movement</div><h1>Your stronger week starts here.</h1><p class="lede">Tell FitBuddy where you are starting. Gemini will shape a practical seven-day plan around your goal, body, and pace.</p></div>
        <form class="panel" action="/generate-workout" method="post">
            {% if error %}<div class="error">{{ error }}</div>{% endif %}
            <h2>Build your plan</h2>
            <div class="form-grid">
                <div class="field"><label for="username">Name / username</label><input id="username" name="username" required maxlength="100"></div>
                <div class="field"><label for="user_id">User ID</label><input id="user_id" name="user_id" required maxlength="50"></div>
                <div class="field"><label for="age">Age</label><input id="age" name="age" type="number" min="13" max="100" required></div>
                <div class="field"><label for="weight">Weight (kg)</label><input id="weight" name="weight" type="number" min="20" max="500" step="0.1" required></div>
                <div class="field"><label for="goal">Fitness goal</label><select id="goal" name="goal" required><option value="">Choose a goal</option><option>Weight Loss</option><option>Muscle Gain</option><option>General Wellness</option><option>Flexibility</option></select></div>
                <div class="field"><label for="intensity">Workout intensity</label><select id="intensity" name="intensity" required><option value="">Choose intensity</option><option>Low</option><option>Medium</option><option>High</option></select></div>
                <div class="field full"><button type="submit">Generate my 7-day plan</button></div>
            </div>
        </form>
    </section>
</main>

</body>
</html>
